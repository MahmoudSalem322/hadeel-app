name: hadeel
description: "هديل | Hadeel — رفيقك اليومي للقرآن والذكر. Offline-first Islamic companion app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  adhan: ^2.0.0+1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.0
  geolocator: ^14.0.3
  go_router: ^18.0.1
  hijri: ^3.0.1
  intl: ^0.20.3
  meta: ^1.19.0
  scrollable_positioned_list: ^0.3.8
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  integration_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  xml: ^7.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/
    - assets/branding/
    - assets/quran/

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/icon_1024.png
  adaptive_icon_background: "#123C35"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#F8F7F2"
  image: assets/branding/splash_logo.png
  color_dark: "#0D1715"
  image_dark: assets/branding/splash_logo.png
  android_12:
    color: "#F8F7F2"
    image: assets/branding/splash_logo.png
    color_dark: "#0D1715"
    image_dark: assets/branding/splash_logo.png
  web: false
